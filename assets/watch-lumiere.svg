<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 650" width="100%" height="100%">
  <defs>
    <radialGradient id="ivoryDialGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F7F5ED"/>
      <stop offset="100%" stop-color="#e8e4d3"/>
    </radialGradient>
    <linearGradient id="lumiereSteel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7a828a"/>
      <stop offset="25%" stop-color="#b8c0c9"/>
      <stop offset="50%" stop-color="#f0f3f6"/>
      <stop offset="75%" stop-color="#b8c0c9"/>
      <stop offset="100%" stop-color="#6f777f"/>
    </linearGradient>
    <filter id="shadowLumiere" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <g filter="url(#shadowLumiere)">
    <!-- Steel Bracelet Upper -->
    <path d="M 132 50 L 268 50 L 262 190 L 138 190 Z" fill="url(#lumiereSteel)"/>
    <line x1="133" y1="95" x2="267" y2="95" stroke="#4a525a" stroke-width="2"/>
    <line x1="135" y1="140" x2="265" y2="140" stroke="#4a525a" stroke-width="2"/>
    <line x1="137" y1="180" x2="263" y2="180" stroke="#4a525a" stroke-width="2"/>

    <!-- Steel Bracelet Lower -->
    <path d="M 138 440 L 262 440 L 268 580 L 132 580 Z" fill="url(#lumiereSteel)"/>
    <line x1="137" y1="475" x2="263" y2="475" stroke="#4a525a" stroke-width="2"/>
    <line x1="135" y1="520" x2="265" y2="520" stroke="#4a525a" stroke-width="2"/>
    <line x1="133" y1="555" x2="267" y2="555" stroke="#4a525a" stroke-width="2"/>

    <!-- Case Lugs -->
    <path d="M 125 180 Q 110 230 110 315 Q 110 400 125 450 L 275 450 Q 290 400 290 315 Q 290 230 275 180 Z" fill="url(#lumiereSteel)"/>

    <!-- Polished Bezel Ring -->
    <circle cx="200" cy="315" r="124" fill="url(#lumiereSteel)"/>
    <circle cx="200" cy="315" r="116" fill="#F7F5ED" stroke="#b8c0c9" stroke-width="2"/>

    <!-- Dial Face (Warm Ivory Radiance) -->
    <circle cx="200" cy="315" r="108" fill="url(#ivoryDialGlow)"/>

    <!-- Crown -->
    <rect x="295" y="300" width="16" height="30" rx="3" fill="url(#lumiereSteel)"/>

    <!-- AW Monogram at 12 o'clock -->
    <text x="190" y="240" font-family="'Playfair Display', serif" font-size="16" font-weight="700" fill="#111111">A</text>
    <text x="200" y="241" font-family="'Playfair Display', serif" font-size="16" font-weight="700" fill="#111111">W</text>
    <text x="200" y="254" font-family="'Montserrat', sans-serif" font-size="6.5" font-weight="600" fill="#111111" text-anchor="middle" letter-spacing="2">ALBERTO</text>
    <text x="200" y="262" font-family="'Montserrat', sans-serif" font-size="4.5" fill="#8d7a4d" text-anchor="middle" letter-spacing="1">LUMIÈRE &bull; 39MM</text>

    <!-- Hour Markers (Polished Steel Batons) -->
    <!-- 1 --> <rect x="246" y="244" width="5" height="15" rx="1" transform="rotate(30 248 251)" fill="#4a525a"/>
    <!-- 2 --> <rect x="278" y="278" width="5" height="15" rx="1" transform="rotate(60 280 285)" fill="#4a525a"/>
    <!-- 3 Date -->
    <rect x="266" y="303" width="26" height="24" rx="2" fill="#FFFFFF" stroke="#8d7a4d" stroke-width="1.5"/>
    <text x="274" y="320" font-family="'Playfair Display', serif" font-size="14" font-weight="bold" fill="#111111">15</text>
    <!-- 4 --> <rect x="278" y="338" width="5" height="15" rx="1" transform="rotate(120 280 345)" fill="#4a525a"/>
    <!-- 5 --> <rect x="246" y="374" width="5" height="15" rx="1" transform="rotate(150 248 381)" fill="#4a525a"/>
    <!-- 6 --> <rect x="197" y="388" width="6" height="16" rx="1" fill="#4a525a"/>
    <!-- 7 --> <rect x="148" y="374" width="5" height="15" rx="1" transform="rotate(-150 150 381)" fill="#4a525a"/>
    <!-- 8 --> <rect x="116" y="338" width="5" height="15" rx="1" transform="rotate(-120 118 345)" fill="#4a525a"/>
    <!-- 9 --> <rect x="106" y="312" width="16" height="6" rx="1" fill="#4a525a"/>
    <!-- 10 --> <rect x="116" y="278" width="5" height="15" rx="1" transform="rotate(-60 118 285)" fill="#4a525a"/>
    <!-- 11 --> <rect x="148" y="244" width="5" height="15" rx="1" transform="rotate(-30 150 251)" fill="#4a525a"/>

    <!-- Dial Bottom Text -->
    <text x="200" y="365" font-family="'Montserrat', sans-serif" font-size="5.5" font-weight="600" fill="#8d7a4d" text-anchor="middle" letter-spacing="1.5">AUTOMATIC CHRONOMETER</text>
    <text x="200" y="415" font-family="'Montserrat', sans-serif" font-size="4.5" fill="#6e7870" text-anchor="middle">SWISS MOVEMENT</text>

    <!-- Hands -->
    <g transform="rotate(-50 200 315)">
      <polygon points="196.5,315 198,245 200,235 202,245 203.5,315" fill="#2b3137"/>
    </g>
    <g transform="rotate(35 200 315)">
      <polygon points="197,315 198.5,210 200,200 201.5,210 203,315" fill="#2b3137"/>
    </g>
    <g transform="rotate(115 200 315)">
      <line x1="200" y1="350" x2="200" y2="195" stroke="#8d7a4d" stroke-width="1.5"/>
      <circle cx="200" cy="225" r="3" fill="#8d7a4d"/>
    </g>

    <!-- Center Cap -->
    <circle cx="200" cy="315" r="5" fill="#4a525a"/>
    <circle cx="200" cy="315" r="2" fill="#111"/>
  </g>
</svg>
